<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'nonce-{{nonce}}'; script-src 'nonce-{{nonce}}';">
<title>DevOrch</title>
<style nonce="{{nonce}}">
	* { box-sizing: border-box; }
	html, body { height: 100%; margin: 0; }
	body {
		display: flex; flex-direction: column; overflow: hidden;
		font-family: var(--vscode-font-family); font-size: var(--vscode-font-size);
		color: var(--vscode-foreground); background: var(--vscode-sideBar-background, var(--vscode-editor-background));
	}
	button { font: inherit; color: inherit; cursor: pointer; }
	.icon-btn {
		background: none; border: 1px solid transparent; border-radius: 4px; padding: 3px 7px;
		color: var(--vscode-icon-foreground, var(--vscode-foreground)); opacity: .85;
	}
	.icon-btn:hover { background: var(--vscode-toolbar-hoverBackground); opacity: 1; }
	.icon-btn:focus-visible, button:focus-visible, textarea:focus-visible { outline: 1px solid var(--vscode-focusBorder); }

	header {
		display: flex; align-items: center; gap: 6px; padding: 8px 10px;
		border-bottom: 1px solid var(--vscode-panel-border, var(--vscode-widget-border, transparent));
	}
	header .title { font-weight: 600; flex: 1; min-width: 0; }
	header .sub { display: block; font-weight: 400; font-size: .85em; color: var(--vscode-descriptionForeground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

	main { flex: 1; overflow-y: auto; padding: 12px 10px; display: flex; flex-direction: column; gap: 12px; }
	.hidden { display: none !important; }

	.msg { max-width: 100%; line-height: 1.5; overflow-wrap: anywhere; }
	.msg.user {
		align-self: flex-end; max-width: 88%; padding: 6px 10px; border-radius: 10px 10px 2px 10px;
		background: var(--vscode-button-secondaryBackground, var(--vscode-input-background)); color: var(--vscode-button-secondaryForeground, inherit);
		white-space: pre-wrap;
	}
	.msg.assistant p { margin: 0 0 .6em; }
	.msg.assistant p:last-child { margin-bottom: 0; }
	.msg.assistant ul, .msg.assistant ol { margin: 0 0 .6em; padding-left: 1.4em; }
	.msg.assistant h1, .msg.assistant h2, .msg.assistant h3 { font-size: 1.05em; margin: .8em 0 .3em; }
	code { font-family: var(--vscode-editor-font-family); font-size: .92em; background: var(--vscode-textCodeBlock-background); padding: 1px 4px; border-radius: 3px; }
	pre {
		position: relative; margin: .4em 0 .7em; padding: 8px 10px; overflow-x: auto; border-radius: 4px;
		background: var(--vscode-textCodeBlock-background); border: 1px solid var(--vscode-widget-border, transparent);
	}
	pre code { background: none; padding: 0; white-space: pre; }
	pre .copy { position: absolute; top: 4px; right: 4px; font-size: .8em; padding: 1px 6px; opacity: 0; background: var(--vscode-button-secondaryBackground); border: 0; border-radius: 3px; }
	pre:hover .copy, pre .copy:focus-visible { opacity: 1; }
	.meta { margin-top: 4px; font-size: .8em; color: var(--vscode-descriptionForeground); }

	.tool { font-size: .9em; border-left: 2px solid var(--vscode-textLink-foreground); padding: 1px 0 1px 8px; color: var(--vscode-descriptionForeground); }
	.tool.err { border-left-color: var(--vscode-errorForeground); }
	.tool summary { cursor: pointer; list-style: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.tool summary::-webkit-details-marker { display: none; }
	.tool b { color: var(--vscode-foreground); font-weight: 600; }
	.tool pre { margin: 4px 0; max-height: 180px; font-size: .9em; }

	.thinking { display: flex; gap: 4px; align-items: center; color: var(--vscode-descriptionForeground); font-size: .9em; }
	.dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulse 1.2s infinite ease-in-out; }
	.dot:nth-child(2) { animation-delay: .2s; } .dot:nth-child(3) { animation-delay: .4s; }
	@keyframes pulse { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
	@media (prefers-reduced-motion: reduce) { .dot { animation: none; opacity: .6; } }

	.banner {
		padding: 8px 10px; border-radius: 4px; font-size: .95em;
		background: var(--vscode-inputValidation-errorBackground, rgba(255,0,0,.1)); border: 1px solid var(--vscode-inputValidation-errorBorder, var(--vscode-errorForeground));
	}
	.banner.info { background: var(--vscode-inputValidation-infoBackground); border-color: var(--vscode-inputValidation-infoBorder); }
	.banner code.cmd { display: block; margin: 6px 0; padding: 4px 6px; user-select: all; white-space: pre-wrap; word-break: break-all; }
	.primary { background: var(--vscode-button-background); color: var(--vscode-button-foreground); border: 0; border-radius: 3px; padding: 4px 10px; }
	.primary:hover { background: var(--vscode-button-hoverBackground); }
	.link { background: none; border: 0; padding: 0; color: var(--vscode-textLink-foreground); text-decoration: underline; }

	.empty { margin: auto 0; text-align: center; color: var(--vscode-descriptionForeground); }
	.empty h2 { color: var(--vscode-foreground); font-size: 1.1em; margin: 0 0 4px; }
	.chips { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; }
	.chip { text-align: left; padding: 6px 10px; border-radius: 4px; background: var(--vscode-input-background); border: 1px solid var(--vscode-input-border, var(--vscode-widget-border, transparent)); }
	.chip:hover { border-color: var(--vscode-focusBorder); }

	.history { flex: 1; overflow-y: auto; padding: 6px; }
	.row { display: flex; align-items: center; gap: 4px; border-radius: 4px; }
	.row:hover { background: var(--vscode-list-hoverBackground); }
	.row button.open { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 6px 8px; }
	.row .t { display: block; line-height: 1.5; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.row .s { display: block; font-size: .85em; color: var(--vscode-descriptionForeground); }
	.row.current { background: var(--vscode-list-inactiveSelectionBackground); }

	footer { padding: 8px 10px 10px; border-top: 1px solid var(--vscode-panel-border, var(--vscode-widget-border, transparent)); }
	.box { border: 1px solid var(--vscode-input-border, var(--vscode-widget-border)); border-radius: 6px; background: var(--vscode-input-background); }
	.box:focus-within { border-color: var(--vscode-focusBorder); }
	textarea {
		display: block; width: 100%; min-height: 38px; max-height: 160px; resize: none; padding: 8px 10px; border: 0; background: transparent;
		color: var(--vscode-input-foreground); font: inherit; outline: none;
	}
	textarea::placeholder { color: var(--vscode-input-placeholderForeground); }
	.bar { display: flex; align-items: center; gap: 6px; padding: 4px 6px 6px; flex-wrap: wrap; }
	.seg { display: inline-flex; border: 1px solid var(--vscode-widget-border, var(--vscode-input-border, transparent)); border-radius: 4px; overflow: hidden; }
	.seg button { background: none; border: 0; padding: 2px 8px; font-size: .9em; color: var(--vscode-descriptionForeground); }
	.seg button[aria-pressed="true"] { background: var(--vscode-button-background); color: var(--vscode-button-foreground); }
	.attach { font-size: .9em; display: inline-flex; align-items: center; gap: 4px; color: var(--vscode-descriptionForeground); max-width: 45%; }
	.attach span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.spacer { flex: 1; }
	.hint { margin-top: 4px; font-size: .8em; color: var(--vscode-descriptionForeground); }
</style>
</head>
<body>
<header>
	<div class="title">DevOrch<span class="sub" id="sub">&nbsp;</span></div>
	<button class="icon-btn" id="btnNew" title="New chat" aria-label="New chat">＋</button>
	<button class="icon-btn" id="btnHistory" title="Conversations in this folder" aria-label="Conversations" aria-pressed="false">☰</button>
	<button class="icon-btn" id="btnTerminal" title="Open DevOrch in the terminal" aria-label="Open in terminal">&gt;_</button>
	<button class="icon-btn" id="btnSettings" title="Settings" aria-label="Settings">⚙</button>
</header>

<main id="chat" aria-live="polite">
	<div class="empty" id="empty">
		<h2>What are we working on?</h2>
		<div>DevOrch can read and change files in this folder.</div>
		<div class="chips">
			<button class="chip" data-prompt="Explain how this project is structured.">Explain how this project is structured</button>
			<button class="chip" data-prompt="Run the tests and tell me what fails.">Run the tests and tell me what fails</button>
			<button class="chip" data-prompt="Find likely bugs in the open file.">Find likely bugs in the open file</button>
		</div>
	</div>
</main>

<section class="history hidden" id="history" aria-label="Conversations"></section>

<footer>
	<div class="box">
		<textarea id="input" rows="1" placeholder="Ask DevOrch…" title="Enter to send, Shift+Enter for a new line" aria-label="Message"></textarea>
		<div class="bar">
			<div class="seg" role="group" aria-label="Mode">
				<button id="modeAuto" aria-pressed="true" title="DevOrch may edit files and run commands">Auto</button>
				<button id="modePlan" aria-pressed="false" title="Read-only: DevOrch plans but changes nothing">Plan</button>
			</div>
			<label class="attach" id="attachWrap" title="Include the open file with your message"><input type="checkbox" id="attach"><span id="attachName"></span></label>
			<span class="spacer"></span>
			<button class="primary" id="btnSend">Send</button>
			<button class="primary hidden" id="btnStop">Stop</button>
		</div>
	</div>
	<div class="hint" id="hint">Auto mode can edit files and run commands in this folder.</div>
</footer>

<script nonce="{{nonce}}">
(function () {
	const vscode = acquireVsCodeApi();
	const $ = (id) => document.getElementById(id);
	const chat = $('chat'), input = $('input');
	let busy = false, mode = 'auto', status = null, thinking = null;

	const saved = vscode.getState() || {};
	if (saved.mode === 'plan') { setMode('plan'); }

	function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

	// A small, safe Markdown subset: fenced code, inline code, bold, headings, lists, paragraphs.
	function inline(s) {
		return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
	}
	function markdown(src) {
		const out = [];
		const parts = String(src).split(/```[^\n]*\n?/);
		parts.forEach((part, i) => {
			if (i % 2 === 1) { out.push('<pre><button class="copy" type="button">Copy</button><code>' + esc(part.replace(/\n$/, '')) + '</code></pre>'); return; }
			let list = null;
			const close = () => { if (list) { out.push('</' + list + '>'); list = null; } };
			part.split('\n').forEach((line) => {
				let m;
				if ((m = /^\s*[-*]\s+(.*)/.exec(line))) { if (list !== 'ul') { close(); out.push('<ul>'); list = 'ul'; } out.push('<li>' + inline(m[1]) + '</li>'); }
				else if ((m = /^\s*\d+[.)]\s+(.*)/.exec(line))) { if (list !== 'ol') { close(); out.push('<ol>'); list = 'ol'; } out.push('<li>' + inline(m[1]) + '</li>'); }
				else if ((m = /^#{1,3}\s+(.*)/.exec(line))) { close(); out.push('<h3>' + inline(m[1]) + '</h3>'); }
				else if (line.trim()) { close(); out.push('<p>' + inline(line) + '</p>'); }
				else { close(); }
			});
			close();
		});
		return out.join('');
	}

	function scroll() { chat.scrollTop = chat.scrollHeight; }
	function add(el) { $('empty').classList.add('hidden'); chat.appendChild(el); scroll(); return el; }
	function el(tag, cls, html) { const e = document.createElement(tag); if (cls) { e.className = cls; } if (html !== undefined) { e.innerHTML = html; } return e; }

	function userMsg(text) { add(el('div', 'msg user')).textContent = text; }
	function assistantMsg(text, meta) {
		const d = add(el('div', 'msg assistant', markdown(text)));
		if (meta) { d.appendChild(el('div', 'meta', esc(meta))); }
	}
	function banner(html, cls) { return add(el('div', 'banner ' + (cls || ''), html)); }

	function setBusy(on) {
		busy = on;
		$('btnSend').classList.toggle('hidden', on);
		$('btnStop').classList.toggle('hidden', !on);
		input.disabled = false;
		if (on) {
			thinking = add(el('div', 'thinking', '<span class="dot"></span><span class="dot"></span><span class="dot"></span><span>Working…</span>'));
		} else if (thinking) { thinking.remove(); thinking = null; }
	}

	function toolSummary(name, a) {
		a = a || {};
		const v = a.command || a.path || a.query || a.pattern || a.url || a.action || '';
		return '<b>' + esc(name) + '</b> ' + esc(String(v).slice(0, 120));
	}
	function toolMsg(m) {
		const d = el('details', 'tool' + (m.isError ? ' err' : ''));
		d.appendChild(el('summary', '', toolSummary(m.name, m.arguments)));
		if (m.output) { d.appendChild(el('pre', '', '<code>' + esc(m.output) + '</code>')); }
		if (thinking) { chat.insertBefore(d, thinking); $('empty').classList.add('hidden'); scroll(); } else { add(d); }
	}

	function setMode(m) {
		mode = m;
		$('modeAuto').setAttribute('aria-pressed', String(m === 'auto'));
		$('modePlan').setAttribute('aria-pressed', String(m === 'plan'));
		$('hint').textContent = m === 'auto' ? 'Auto mode can edit files and run commands in this folder.' : 'Plan mode is read-only: DevOrch looks around and proposes changes.';
		vscode.setState({ mode: m });
	}

	function send(text) {
		text = (text || input.value).trim();
		if (!text || busy) { return; }
		userMsg(text);
		input.value = ''; grow();
		setBusy(true);
		vscode.postMessage({ type: 'send', text, mode, attachFile: $('attach').checked });
	}

	function grow() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 160) + 'px'; }

	function renderStatus(s) {
		status = s;
		$('sub').textContent = s.installed ? (s.version + (s.provider ? ' · ' + s.provider : '') + (s.model ? '/' + s.model : '')) : 'not installed';
		$('attachWrap').classList.toggle('hidden', !s.file);
		$('attachName').textContent = s.file || '';
		if (!saved.mode) { setMode(s.mode); }
		if (s.installed && s.outdated && !chat.querySelector('.banner.info')) {
			const b = banner('<b>Update DevOrch</b> (you have ' + esc(s.version) + '). The chat panel needs a newer release. Update with this command; the terminal opens with it typed in, press Enter to run:<code class="cmd">' + esc(s.installCommand) + '</code><button class="primary" id="doInstall" type="button">Open terminal</button> <button class="link" id="doRecheck" type="button">I updated it</button>', 'info');
			b.querySelector('#doInstall').onclick = () => vscode.postMessage({ type: 'install' });
			b.querySelector('#doRecheck').onclick = () => { b.remove(); vscode.postMessage({ type: 'refresh' }); };
		}
		if (!s.installed && !chat.querySelector('.banner.info')) {
			const b = banner('<b>DevOrch is not installed</b> (looked for <code>' + esc(s.exe) + '</code>).<br>Install it with this command; the terminal will open with it typed in, press Enter to run:<code class="cmd">' + esc(s.installCommand) + '</code><button class="primary" id="doInstall" type="button">Open terminal</button> <button class="link" id="doRecheck" type="button">I installed it</button>', 'info');
			b.querySelector('#doInstall').onclick = () => vscode.postMessage({ type: 'install' });
			b.querySelector('#doRecheck').onclick = () => { b.remove(); vscode.postMessage({ type: 'refresh' }); };
		}
	}

	function renderHistory(rows) {
		const box = $('history');
		box.innerHTML = '';
		if (!rows.length) { box.appendChild(el('div', 'empty', '<h2>No conversations yet</h2>Chats you start in this folder show up here.')); return; }
		rows.forEach((r) => {
			const row = el('div', 'row' + (r.id === currentId ? ' current' : ''));
			const open = el('button', 'open', '<span class="t">' + esc(r.title || 'Untitled') + '</span><span class="s">' + esc(r.provider + '/' + r.model + ' · ' + r.messages + ' messages') + '</span>');
			open.onclick = () => { vscode.postMessage({ type: 'loadSession', id: r.id }); toggleHistory(false); };
			const del = el('button', 'icon-btn', '✕'); del.title = 'Delete'; del.setAttribute('aria-label', 'Delete conversation');
			del.onclick = () => vscode.postMessage({ type: 'deleteSession', id: r.id });
			row.append(open, del); box.appendChild(row);
		});
	}
	let currentId = null;

	function toggleHistory(show) {
		const on = show === undefined ? $('history').classList.contains('hidden') : show;
		$('history').classList.toggle('hidden', !on);
		chat.classList.toggle('hidden', on);
		$('btnHistory').setAttribute('aria-pressed', String(on));
		if (on) { vscode.postMessage({ type: 'refresh' }); }
	}

	function reset() {
		chat.querySelectorAll('.msg, .tool, .banner, .thinking').forEach((n) => n.remove());
		$('empty').classList.remove('hidden');
		currentId = null; thinking = null; busy = false;
		$('btnSend').classList.remove('hidden'); $('btnStop').classList.add('hidden');
	}

	window.addEventListener('message', (e) => {
		const m = e.data;
		switch (m.type) {
			case 'status': renderStatus(m); break;
			case 'sessions': renderHistory(m.rows); break;
			case 'cleared': reset(); break;
			case 'loaded':
				reset(); currentId = m.sessionId;
				m.messages.forEach((x) => x.role === 'user' ? userMsg(x.content) : assistantMsg(x.content));
				break;
			case 'prefill': input.value = m.text; grow(); input.focus(); break;
			case 'start': break;
			case 'tool': toolMsg(m); break;
			case 'answer':
				assistantMsg(m.text, [m.model, m.ms ? (m.ms / 1000).toFixed(1) + 's' : '', m.tokens ? m.tokens + ' tokens' : '', m.cost ? '$' + m.cost.toFixed(4) : ''].filter(Boolean).join(' · '));
				break;
			case 'error':
				banner(esc(m.text) + (m.notInstalled ? '' : ''));
				if (m.notInstalled) { vscode.postMessage({ type: 'refresh' }); }
				break;
			case 'end':
				setBusy(false);
				if (m.cancelled) { add(el('div', 'meta', 'Stopped.')); }
				input.focus();
				break;
		}
	});

	$('btnSend').onclick = () => send();
	$('btnStop').onclick = () => vscode.postMessage({ type: 'cancel' });
	$('btnNew').onclick = () => { vscode.postMessage({ type: 'newChat' }); toggleHistory(false); input.focus(); };
	$('btnHistory').onclick = () => toggleHistory();
	$('btnTerminal').onclick = () => vscode.postMessage({ type: 'openTerminal' });
	$('btnSettings').onclick = () => vscode.postMessage({ type: 'openSettings' });
	$('modeAuto').onclick = () => setMode('auto');
	$('modePlan').onclick = () => setMode('plan');
	document.querySelectorAll('.chip').forEach((c) => { c.onclick = () => send(c.dataset.prompt); });
	chat.addEventListener('click', (e) => {
		const b = e.target.closest && e.target.closest('.copy');
		if (b) { navigator.clipboard && navigator.clipboard.writeText(b.parentElement.querySelector('code').textContent); b.textContent = 'Copied'; setTimeout(() => { b.textContent = 'Copy'; }, 1200); }
	});
	input.addEventListener('input', grow);
	input.addEventListener('keydown', (e) => {
		if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
		if (e.key === 'Escape' && busy) { vscode.postMessage({ type: 'cancel' }); }
	});
	vscode.postMessage({ type: 'ready' });
	window.addEventListener('focus', () => vscode.postMessage({ type: 'refresh' }));
})();
</script>
</body>
</html>
