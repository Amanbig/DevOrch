name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v0.1.0, v1.0.0
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  build-extension:
    name: Build VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - run: npm ci

      - run: npm test

      - name: Package the .vsix
        run: npx --yes @vscode/vsce package --no-dependencies -o devorch-code.vsix

      - name: Upload the .vsix
        uses: actions/upload-artifact@v7
        with:
          name: vscode-extension
          path: vscode-extension/devorch-code.vsix

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/devorch
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  publish-vscode:
    name: Publish VS Code extension
    # after PyPI: the extension's Ask mode needs the CLI release that goes out in the same tag
    needs: [publish-pypi, build-extension]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # trusted publishing: the Marketplace trusts this workflow, no token is stored
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Download the .vsix
        uses: actions/download-artifact@v8
        with:
          name: vscode-extension
          path: extension/

      # --skip-duplicate: a tag that does not change the extension version is not an error
      - name: Publish to the Visual Studio Marketplace
        run: npx --yes @vscode/vsce@4.1.0 publish --oidc --packagePath extension/devorch-code.vsix --skip-duplicate

  create-github-release:
    name: Create GitHub Release
    needs: [publish-pypi, build-extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Download the VS Code extension
        uses: actions/download-artifact@v8
        with:
          name: vscode-extension
          path: extension/

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "DevOrch v${{ steps.get_version.outputs.VERSION }}" \
            --generate-notes \
            dist/* extension/devorch-code.vsix
