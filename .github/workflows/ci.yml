name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff linter
        run: ruff check .

      - name: Run Ruff formatter check
        run: ruff format --check .

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest --cov=. --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # Exercises the same steps as the release workflow (build, upload-artifact, download-artifact, install)
  # without publishing, so a bump of one of those actions is tested on a pull request and not first
  # discovered when a version tag is pushed.
  package:
    name: Package (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check distribution metadata
        run: twine check --strict dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-package-smoke
          path: dist/
          retention-days: 1

  package-install:
    name: Package (install the built wheel)
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-package-smoke
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Check the wheel ships only the devorch package
        run: |
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          top = {n.split("/")[0] for n in names}
          extra = {t for t in top if t != "devorch" and not t.endswith(".dist-info")}
          print("top-level entries:", sorted(top))
          assert not extra, f"the wheel installs generic top-level names that can clash: {sorted(extra)}"
          PY

      - name: Install the wheel into a clean environment and run it
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          out="$(/tmp/smoke/bin/devorch --version)"
          echo "$out"
          echo "$out" | grep -Eq '^devorch [0-9]+\.[0-9]+\.[0-9]+'

  # Run the real install scripts end to end on the OS they target, against the wheel built above
  # (--from), so a change that breaks `curl ... | sh` or `irm ... | iex` is caught on the pull request.
  install-script:
    name: Install script (${{ matrix.os }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Download the built wheel
        uses: actions/download-artifact@v8
        with:
          name: python-package-smoke
          path: dist/

      # No uv, pipx or required Python is assumed: the script bootstraps uv, which fetches Python.
      - name: Install with install.sh, piped into sh like curl | sh
        run: cat install.sh | sh -s -- --yes --from "$(ls dist/*.whl)"

      - name: Run the installed command
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          out="$(devorch --version)"
          echo "$out"
          echo "$out" | grep -Eq '^devorch [0-9]+\.[0-9]+\.[0-9]+'

      - name: Run it again (upgrade) and then uninstall
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          sh install.sh --yes --from "$(ls dist/*.whl)"
          sh install.sh --uninstall
          if command -v devorch; then echo "devorch is still installed after --uninstall"; exit 1; fi

  install-script-windows:
    name: Install script (windows)
    needs: package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download the built wheel
        uses: actions/download-artifact@v8
        with:
          name: python-package-smoke
          path: dist/

      - name: Install with install.ps1
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist/*.whl).FullName
          ./install.ps1 -Yes -From $wheel

      - name: Run the installed command
        shell: pwsh
        run: |
          $env:PATH = "$HOME\.local\bin;" + $env:PATH
          $out = devorch --version
          Write-Host $out
          if ($out -notmatch '^devorch \d+\.\d+\.\d+') { throw "unexpected version output: $out" }

      - name: Run it again (upgrade) and then uninstall
        shell: pwsh
        run: |
          $env:PATH = "$HOME\.local\bin;" + $env:PATH
          $wheel = (Get-ChildItem dist/*.whl).FullName
          ./install.ps1 -Yes -From $wheel
          ./install.ps1 -Uninstall
          if (Get-Command devorch -ErrorAction SilentlyContinue) { throw "devorch is still installed after -Uninstall" }

  vscode-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - run: npm ci

      - name: Type-check, lint and bundle
        run: npm run package

      - name: Unit tests
        run: npm test

      - name: Package the .vsix and check the chat page is inside it
        run: |
          npx --yes @vscode/vsce package --no-dependencies -o devorch-code.vsix
          unzip -l devorch-code.vsix | grep -q 'src/webview.html' || { echo "webview.html missing from the .vsix"; exit 1; }
